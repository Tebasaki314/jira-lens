name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: jira-lens-macos
            binary: target/release/jira-lens
          - os: windows-latest
            artifact: jira-lens-windows
            binary: target/release/jira-lens.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package binaries
        run: |
          chmod +x artifacts/jira-lens-macos/jira-lens
          tar -czf jira-lens-macos.tar.gz -C artifacts/jira-lens-macos jira-lens
          cd artifacts/jira-lens-windows
          zip ../../jira-lens-windows.zip jira-lens.exe
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          jira-lens-macos.tar.gz jira-lens-windows.zip
          --repo "$GITHUB_REPOSITORY"
          --generate-notes --title "Jira Lens $GITHUB_REF_NAME"
