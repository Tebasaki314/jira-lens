[package]
name = "jira-lens"
version = "0.4.0"
edition = "2024"
build = "build.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
keyring = "4.1.6"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
url = "2.5.8"
uuid = { version = "1.24.1", features = ["v4"] }
webbrowser = "1.2.4"

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
